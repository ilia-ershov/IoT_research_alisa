<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="960" height="500" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0f172a">How the pieces fit together</text>

  <!-- panels -->
  <rect x="24"  y="56" width="280" height="420" rx="8" fill="#fafbfc" stroke="#e5e9ef"/>
  <rect x="332" y="56" width="300" height="420" rx="8" fill="#fafbfc" stroke="#e5e9ef"/>
  <rect x="660" y="56" width="276" height="420" rx="8" fill="#fafbfc" stroke="#e5e9ef"/>
  <text x="40"  y="80" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#64748b">YANDEX CLOUD</text>
  <text x="348" y="80" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#64748b">DEVICE · QUASAR (Buildroot / ARM)</text>
  <text x="676" y="80" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#64748b">LAN</text>

  <!-- cloud boxes -->
  <g font-size="12.5">
    <rect x="40" y="92" width="248" height="56" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="54" y="114" font-weight="600" fill="#0f172a">UniProxy</text>
    <text x="54" y="134" font-size="10.5" fill="#64748b">voice: ASR, NLU, directives</text>

    <rect x="40" y="160" width="248" height="66" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="54" y="182" font-weight="600" fill="#0f172a">Quasar backend</text>
    <text x="54" y="201" font-size="10.5" fill="#64748b">quasar.yandex.net</text>
    <text x="54" y="216" font-size="10.5" fill="#64748b">register, config, glagol tokens</text>

    <rect x="40" y="238" width="248" height="56" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="54" y="260" font-weight="600" fill="#0f172a">Telemetry</text>
    <text x="54" y="280" font-size="10.5" fill="#64748b">AppMetrica, clck.yandex.net</text>

    <rect x="40" y="306" width="248" height="50" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="54" y="328" font-weight="600" fill="#0f172a">OTA / CDN</text>
    <text x="54" y="346" font-size="10.5" fill="#64748b">firmware updates</text>
  </g>

  <!-- device boxes -->
  <g font-size="12.5">
    <rect x="348" y="92" width="268" height="74" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="362" y="114" font-weight="600" fill="#0f172a">maind — one binary, many modes</text>
    <text x="362" y="133" font-size="10.5" fill="#64748b">platformd · mediad · telemetry · fluent-bitd</text>
    <text x="362" y="150" font-size="10.5" fill="#94a3b8">local IPC mesh on 127.0.0.1</text>

    <rect x="348" y="178" width="268" height="72" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="362" y="200" font-weight="600" fill="#0f172a">Audio</text>
    <text x="362" y="219" font-size="10.5" fill="#64748b">4 mics → VQE → spotter → cloud</text>
    <text x="362" y="235" font-size="10.5" fill="#64748b">playback → ALSA → TAS5825M amp</text>

    <rect x="348" y="262" width="128" height="56" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="362" y="284" font-weight="600" fill="#0f172a">OP-TEE</text>
    <text x="362" y="303" font-size="10.5" fill="#64748b">device key, signing</text>

    <rect x="488" y="262" width="128" height="56" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="502" y="284" font-weight="600" fill="#0f172a">/data (rw)</text>
    <text x="502" y="303" font-size="10.5" fill="#64748b">tokens, wifi, queue</text>

    <rect x="348" y="330" width="268" height="116" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <rect x="348" y="330" width="4" height="116" rx="2" fill="#dc2626"/>
    <text x="362" y="352" font-weight="600" fill="#b91c1c">Open to the LAN</text>
    <text x="362" y="374" font-size="11" fill="#334155">:5555  adb — root, no auth</text>
    <text x="362" y="394" font-size="11" fill="#334155">:1961  glagol — TLS WS + mDNS</text>
    <text x="362" y="414" font-size="11" fill="#334155">:5081  sip      :7447  zenoh</text>
    <text x="362" y="434" font-size="10.5" fill="#94a3b8">unbound DNS on 127.0.0.1:53</text>
  </g>

  <!-- LAN boxes -->
  <g font-size="12.5">
    <rect x="676" y="92" width="244" height="60" rx="6" fill="#ffffff" stroke="#e5e9ef"/>
    <text x="690" y="114" font-weight="600" fill="#0f172a">Alice app</text>
    <text x="690" y="134" font-size="10.5" fill="#64748b">official: glagol control, setup</text>

    <rect x="676" y="166" width="244" height="96" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="690" y="188" font-weight="600" fill="#1d4ed8">This research</text>
    <text x="690" y="209" font-size="11" fill="#334155">adb → root shell</text>
    <text x="690" y="228" font-size="11" fill="#334155">alice_tts.py, glagol_client.py</text>
    <text x="690" y="247" font-size="10.5" fill="#64748b">IDA on the pulled binary</text>
  </g>

  <!-- arrows cloud <-> device -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="304" y1="120" x2="328" y2="120" marker-end="url(#g)"/>
    <line x1="328" y1="193" x2="304" y2="193" marker-end="url(#g)"/>
    <line x1="304" y1="266" x2="328" y2="266" marker-end="url(#g)"/>
  </g>
  <text x="316" y="112" font-size="9.5" fill="#94a3b8" text-anchor="middle">voice</text>
  <text x="316" y="185" font-size="9.5" fill="#94a3b8" text-anchor="middle">config</text>
  <text x="316" y="258" font-size="9.5" fill="#94a3b8" text-anchor="middle">metrics</text>

  <!-- arrows device <-> LAN -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="632" y1="120" x2="656" y2="120" marker-end="url(#g)"/>
    <line x1="656" y1="205" x2="632" y2="205" marker-end="url(#g)"/>
  </g>
  <text x="644" y="112" font-size="9.5" fill="#94a3b8" text-anchor="middle">glagol</text>
  <text x="644" y="197" font-size="9.5" fill="#94a3b8" text-anchor="middle">adb</text>
</svg>
