<svg xmlns="http://www.w3.org/2000/svg" width="960" height="356" viewBox="0 0 960 356" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="960" height="356" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="600" fill="#0f172a">From a LAN foothold to controlling the assistant</text>

  <!-- Phase A -->
  <text x="24" y="74" font-size="12" font-weight="600" letter-spacing="0.4" fill="#64748b">GETTING ROOT</text>
  <g font-size="12.5">
    <!-- node template: w166 h78, y86 -->
    <rect x="24"  y="86" width="166" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="38" y="116" font-weight="600" fill="#0f172a">LAN foothold</text>
    <text x="38" y="137" font-size="11" fill="#64748b">router + a host</text>

    <rect x="210" y="86" width="166" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="224" y="116" font-weight="600" fill="#0f172a">Fake cloud</text>
    <text x="224" y="137" font-size="11" fill="#64748b">be quasar.yandex.net</text>
    <text x="224" y="152" font-size="11" fill="#94a3b8">leaked eMudhra CA</text>

    <rect x="396" y="86" width="166" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="410" y="116" font-weight="600" fill="#0f172a">Enable ADB</text>
    <text x="410" y="137" font-size="11" fill="#64748b">remoteActivation</text>
    <text x="410" y="152" font-size="11" fill="#94a3b8">in get_sync_info</text>

    <rect x="582" y="86" width="166" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="596" y="116" font-weight="600" fill="#0f172a">Nudge an OTA</text>
    <text x="596" y="137" font-size="11" fill="#64748b">one update to .46</text>
    <text x="596" y="152" font-size="11" fill="#94a3b8">factory build too old</text>

    <rect x="768" y="86" width="168" height="78" rx="6" fill="#ffffff" stroke="#dc2626"/>
    <text x="782" y="116" font-weight="600" fill="#b91c1c">Root</text>
    <text x="782" y="137" font-size="11" fill="#64748b">adb :5555, uid 0</text>
    <text x="782" y="152" font-size="11" fill="#94a3b8">pinned open</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)">
    <line x1="190" y1="125" x2="206" y2="125"/>
    <line x1="376" y1="125" x2="392" y2="125"/>
    <line x1="562" y1="125" x2="578" y2="125"/>
    <line x1="748" y1="125" x2="764" y2="125"/>
  </g>

  <!-- divider -->
  <line x1="24" y1="200" x2="936" y2="200" stroke="#eef2f6" stroke-width="1"/>

  <!-- Phase B -->
  <text x="24" y="238" font-size="12" font-weight="600" letter-spacing="0.4" fill="#64748b">AFTER ROOT</text>
  <g font-size="12.5">
    <rect x="24"  y="250" width="288" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="40" y="280" font-weight="600" fill="#0f172a">Reverse maind</text>
    <text x="40" y="301" font-size="11" fill="#64748b">read the 21 MB binary in IDA Pro:</text>
    <text x="40" y="316" font-size="11" fill="#64748b">services, directives, audio, IPC</text>

    <rect x="336" y="250" width="288" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="352" y="280" font-weight="600" fill="#0f172a">Telemetry &amp; privacy</text>
    <text x="352" y="301" font-size="11" fill="#64748b">what leaves the device and when;</text>
    <text x="352" y="316" font-size="11" fill="#64748b">no covert recording</text>

    <rect x="648" y="250" width="288" height="78" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="664" y="280" font-weight="600" fill="#1d4ed8">glagol over Wi-Fi</text>
    <text x="664" y="301" font-size="11" fill="#64748b">reverse the :1961 LAN protocol;</text>
    <text x="664" y="316" font-size="11" fill="#64748b">make Alice say anything</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)">
    <line x1="312" y1="289" x2="332" y2="289"/>
    <line x1="624" y1="289" x2="644" y2="289"/>
  </g>
</svg>
